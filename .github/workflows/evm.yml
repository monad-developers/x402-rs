name: EVM facilitator checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUST_VERSION: '1.93'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
      - run: rustup default "$RUST_VERSION"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: evm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: evm-${{ runner.os }}-${{ runner.arch }}-

      - run: cargo fmt --check
      - run: cargo test --locked -p x402-chain-eip155 --features full
      - run: cargo clippy --locked -p x402-chain-eip155 --features full --all-targets -- -D warnings
      - run: >-
          cargo clippy --locked -p x402-facilitator --no-default-features
          --features chain-eip155,telemetry --all-targets -- -D warnings
      - run: >-
          cargo test --locked -p x402-facilitator --no-default-features
          --features chain-eip155,telemetry
